---
- name: Set up debian box
  hosts: all
  roles:
    - system
    - editor
    - firewall
    - containers
    - terminal
    - role: artis3n.tailscale.machine
      when: "'production' in group_names"
      tags: tailscale
    - notifications
    - file_manager
    - reverse_proxy
    - machine_wake
    - hifis.toolkit.unattended_upgrades
